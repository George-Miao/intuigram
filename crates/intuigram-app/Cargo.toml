[package]
name = "intuigram-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Intuigram application composition and runtime"
publish = false

[dependencies]
compio = { workspace = true, features = ["actor", "dispatcher", "fs", "process", "runtime"] }
compio-mtproto.workspace = true
crossterm.workspace = true
dirs.workspace = true
futures-util.workspace = true
flume.workspace = true
getrandom = { workspace = true, features = ["std"] }
intuigram-config.workspace = true
intuigram-lib.workspace = true
intuigram-media.workspace = true
intuigram-store.workspace = true
intuigram-telegram.workspace = true
intuigram-tui.workspace = true
pbkdf2.workspace = true
rich-clipboard.workspace = true
rpassword.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["crypto-rust", "linux-native-sync-persistent"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
