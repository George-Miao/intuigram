[package]
name = "intuigram"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "A fluent, configurable Telegram terminal client"
readme = "../../README.md"
keywords = ["telegram", "terminal", "tui"]
categories = ["command-line-utilities"]
default-run = "intuigram"
publish = false

[dependencies]
compio = { version = "0.19.1", default-features = false, features = ["fs", "process", "runtime"] }
crossterm.workspace = true
dirs.workspace = true
futures-util.workspace = true
getrandom = { workspace = true, features = ["std"] }
intuigram-app.workspace = true
intuigram-config.workspace = true
intuigram-media.workspace = true
intuigram-store.workspace = true
intuigram-telegram.workspace = true
intuigram-tui.workspace = true
rich-clipboard.workspace = true
rpassword.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true

[dev-dependencies]
test-harness.workspace = true
tempfile.workspace = true

[lints]
workspace = true
