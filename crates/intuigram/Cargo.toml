[package]
name = "intuigram"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "A fluent, configurable Telegram terminal client"
readme = "../../README.md"
keywords = ["telegram", "terminal", "tui"]
categories = ["command-line-utilities"]
default-run = "intuigram"
publish = false

[dependencies]
clap = { workspace = true, features = ["derive"] }
compio = { workspace = true, features = ["macros", "runtime"] }
intuigram-app.workspace = true

[dev-dependencies]
intuigram-lib.workspace = true
intuigram-telegram.workspace = true
tempfile.workspace = true
test-harness.workspace = true

[lints]
workspace = true
