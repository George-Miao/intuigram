name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: intuigram-linux-x86_64
            binary: target/release/intuigram
          - os: macos-14
            artifact: intuigram-macos-aarch64
            binary: target/release/intuigram
          - os: windows-latest
            artifact: intuigram-windows-x86_64
            binary: target/release/intuigram.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p intuigram
      - if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.binary }}" README.md
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.binary }}",README.md -DestinationPath "${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: intuigram-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
