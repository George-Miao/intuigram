# Telegram application credentials from https://my.telegram.org/apps.
# Each Intuigram user supplies their own application ID and hash.
[telegram]
api_id = 123456
api_hash = "replace-with-your-api-hash"

# Optional phone-login fallback. When omitted, Intuigram prompts after you press P
# on the QR-login screen.
# phone_number = "+12025550123"

# Proxy routes are tried in order. Direct TCP is the final fallback by default.
[connection]
direct_fallback = true
timeout_seconds = 10

# [[connection.proxies]]
# kind = "socks5"
# host = "127.0.0.1"
# port = 1080
# dns = "remote" # or "local" for domain targets
# auth = { username = "user", password = "secret" }

# [[connection.proxies]]
# kind = "http-connect"
# host = "proxy.example"
# port = 8080
# auth = { username = "user", password = "secret" }

# [[connection.proxies]]
# kind = "mt-proxy"
# host = "proxy.example"
# port = 443
# secret = "dd00112233445566778899aabbccddeeff"

[media]
# Maximum redownloadable media-cache size in bytes. The default is 2 GiB.
cache_bytes = 2147483648

[view]
# "default" adds breathing room; "compact" preserves the original dense layout.
mode = "default"
# Maximum Message body and metadata width in terminal cells.
message_max_width = 96

# Optional Local Lock encrypts the complete Account database, including
# Telegram authorization and synchronized Message text. Use "keyring" to keep
# a random key in the OS credential vault, or "passphrase" to prompt at launch.
[local_lock]
enabled = false
unlock = "passphrase"

# Intuigram normally uses platform-native data, cache, and Downloads directories.
# Uncomment only the paths you want to override.
# [paths]
# data = "/path/to/intuigram-data"
# cache = "/path/to/intuigram-cache"
# downloads = "/path/to/Downloads"
