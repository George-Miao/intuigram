[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
compio-mtproto = { path = "crates/compio-mtproto" }
compio-term = { path = "crates/compio-term" }
intuigram = { path = "crates/intuigram" }
intuigram-app = { path = "crates/intuigram-app" }
intuigram-config = { path = "crates/intuigram-config" }
intuigram-media = { path = "crates/intuigram-media" }
intuigram-store = { path = "crates/intuigram-store" }
intuigram-telegram = { path = "crates/intuigram-telegram" }
intuigram-tui = { path = "crates/intuigram-tui" }
rich-clipboard = { path = "crates/rich-clipboard" }
test-harness = { path = "crates/test-harness" }
figment = "0.10.19"
serde = "1"
serde_json = "1"
snafu = "0.8"
tempfile = "3"
refinery = "0.9.2"
rusqlite = "0.39"
rustix = "1"
futures-util = "0.3"
crossterm = "0.29"
ratatui = "0.30"
dirs = "6"
rpassword = "7.5"
time = "0.3.54"
compio = "0.19.1"
compio-io = "0.10.1"
grammers-crypto = "0.10"
grammers-mtproto = "0.10"
grammers-tl-types = "0.10"
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
md5 = "0.8.1"
base64 = "0.22.1"
qrcode = "0.14.1"
signal-hook = "0.3.18"
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_errors_doc = "allow"
module_name_repetitions = "allow"
