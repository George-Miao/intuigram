[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/George-Miao/popgram"
homepage = "https://github.com/George-Miao/popgram"
rust-version = "1.85"

[workspace.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
compio-mtproto = { version = "0.1.0", path = "crates/compio-mtproto" }
intuigram-app = { version = "0.1.0", path = "crates/intuigram-app" }
intuigram-config = { version = "0.1.0", path = "crates/intuigram-config" }
intuigram-lib = { version = "0.1.0", path = "crates/intuigram-lib" }
intuigram-media = { version = "0.1.0", path = "crates/intuigram-media" }
intuigram-store = { version = "0.1.0", path = "crates/intuigram-store" }
intuigram-telegram = { version = "0.1.0", path = "crates/intuigram-telegram" }
intuigram-tui = { version = "0.1.0", path = "crates/intuigram-tui" }
rich-clipboard = { version = "0.1.0", path = "crates/rich-clipboard" }
rasterm = { version = "0.1.0", path = "crates/rasterm" }
test-harness = { version = "0.0.0", path = "crates/test-harness" }
figment = "0.10.19"
serde = "1"
serde_json = "1"
snafu = "0.8"
tempfile = "3"
refinery = "0.9.2"
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
rustix = "1"
futures-util = "0.3"
flume = { version = "0.12", default-features = false, features = ["async"] }
crossterm = "0.29"
ratatui = "0.30"
dirs = "6"
rpassword = "7.5"
time = "0.3.54"
aes = "0.8.4"
compio = { git = "https://github.com/compio-rs/compio.git", branch = "master", default-features = false }
ctr = "0.9.2"
grammers-crypto = "0.10"
grammers-mtproto = "0.10"
grammers-tl-types = { version = "0.10", features = ["deserializable-functions"] }
getrandom = { version = "0.3", features = ["std"] }
keyring = "3.6.3"
pbkdf2 = "0.13"
sha2 = "0.11"
zeroize = { version = "1.9", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
md5 = "0.8.1"
num-bigint = "0.4.6"
percent-encoding = "2.3.2"
base64 = "0.22.1"
clap = "4.5"
qrcode = { version = "0.14.1", default-features = false }
sha1 = "0.10.6"
url = "2.5.7"
vt100 = "0.16.2"
tracing = "0.1"
tracing-subscriber = "0.3"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_errors_doc = "allow"
module_name_repetitions = "allow"
